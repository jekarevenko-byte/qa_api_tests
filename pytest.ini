[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --tb=short
    --strict-markers
    --html=reports/report.html
    --self-contained-html

markers =
    smoke: Fast smoke tests (deselect with '-m "not smoke"')
    regression: Full regression suite
    users: Tests related to user endpoints
    posts: Tests related to post endpoints
    negative: Negative / error-path tests

log_cli = true
log_cli_level = INFO
log_format = %(asctime)s [%(levelname)s] %(message)s
log_date_format = %H:%M:%S
